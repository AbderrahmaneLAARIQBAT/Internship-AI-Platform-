services:
  db:
    image: postgres:16-alpine
    container_name: intern_ai_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-intern_ai}
      POSTGRES_USER: ${POSTGRES_USER:-intern_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-securepassword}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01_init.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-intern_admin} -d ${POSTGRES_DB:-intern_ai}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - intern_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: intern_ai_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-intern_ai}
      POSTGRES_USER: ${POSTGRES_USER:-intern_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-securepassword}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      SECRET_KEY: ${SECRET_KEY:-super-secret-key-change-in-production-minimum-32-chars}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
    volumes:
      - ./backend:/app
      - uploads_data:/app/app/uploads
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - intern_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: intern_ai_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - intern_network

volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local

networks:
  intern_network:
    driver: bridge
